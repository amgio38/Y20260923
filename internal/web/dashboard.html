<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ProjectBoard</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f8f9fa;
    --card: #ffffff;
    --border: #dadce0;
    --text: #202124;
    --muted: #5f6368;
    --hover: #f1f3f4;
    --selected: #e8eaed;
    --accent: #1a73e8;
    --st-todo: #5f6368;
    --st-in_progress: #1a73e8;
    --st-review: #f9ab00;
    --st-blocked: #d93025;
    --st-hold: #80868b;
    --st-done: #188038;
    --st-cancel: #9aa0a6;
    --st-archived: #795548;
    /* 變動閃爍（F2）：變動格強色、父層鏈淡色（沿用強調色，兩個主題各自給 rgba）。 */
    --flash: rgba(26, 115, 232, .30);
    --flash-parent: rgba(26, 115, 232, .15);
  }
  /* 暗色：對齊 claude.ai（cds token：gray-850/800/400/50、clay #d97757）。只覆寫 token，不重抄整份 CSS。 */
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #151515;
    --card: #20201f;
    --border: rgba(255, 255, 255, .10);
    --text: #f0efec;
    --muted: #898781;
    --hover: rgba(255, 255, 255, .06);
    --selected: rgba(217, 119, 87, .16);
    --accent: #d97757;
    --st-todo: #898781;
    --st-in_progress: #d97757;
    --st-review: #c98500;
    --st-blocked: #e66767;
    --st-hold: #6d6b67;
    --st-done: #91d68b;
    --st-cancel: #52514e;
    --st-archived: #a1887f;
    --flash: rgba(217, 119, 87, .32);
    --flash-parent: rgba(217, 119, 87, .16);
  }
  /* 暗色卡片質感：比照 claude.ai 的圓角與低對比邊框（淺色主題不動）。 */
  [data-theme="dark"] .card { border-radius: 12px; }
  [data-theme="dark"] .btn,
  [data-theme="dark"] select { border-radius: 8px; }
  [data-theme="dark"] .topbar,
  [data-theme="dark"] .tabs { background: var(--bg); }
  [data-theme="dark"] .theme-toggle:hover { background: var(--hover); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .topbar {
    display: flex; align-items: center; gap: 16px;
    height: 56px; padding: 0 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .brand { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
  /* Claude Code 風格：品牌用 asterisk 記號（clay）。 */
  .brand-mark { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; margin-right: 8px; vertical-align: -5px; }
  .topbar .spacer { flex: 1; }
  .topbar .meta { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .dot-sep { color: var(--border); }
  /* 即時連線狀態小燈（F1）：綠＝SSE 連線中、灰＝重連中；不打擾（沉在 topbar 一隅）。 */
  .live-status { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
  .live-status .live-dot { font-size: 10px; line-height: 1; color: var(--muted); }
  .live-status.on .live-dot { color: var(--st-done); }

  .btn {
    font: inherit; font-size: 12px; color: var(--text);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 12px; cursor: pointer;
  }
  .btn:hover { background: var(--hover); }

  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0; flex: none;
    color: var(--muted); background: var(--card);
    border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
  }
  .theme-toggle:hover { background: var(--hover); color: var(--text); }
  .theme-toggle svg { width: 16px; height: 16px; display: block; }
  .theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: block; }

  .wrap { max-width: 1360px; margin: 0 auto; padding: 16px 20px 40px; }

  .stats {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin: 6px 0 16px;
  }
  .chip {
    position: relative;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 10px; font-size: 12px; color: var(--muted);
  }
  .chip .num { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* badge：手機未讀數字風格——貼在 chip 右上角的小圓角標，0 時整個不生成（見 numBadge）。 */
  .badge {
    position: absolute; top: -6px; right: -6px;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px; background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
    font-variant-numeric: tabular-nums; pointer-events: none;
  }

  /* 狀態統計＝可點的過濾器（點某狀態，下面清單只留該類；「全部」在前面） */
  .stat-chip { cursor: pointer; font: inherit; font-size: 12px; }
  .stat-chip:hover { background: var(--hover); }
  .stat-chip.active { border-color: var(--accent); color: var(--accent); }
  /* active時徽章底色不跟著換成 --text——暗色模式 --text 是淺色，配白字會白底白字看不到，
     固定用 --accent（跟主題色點同一套）保證跟白字對比在兩個主題下都夠。 */

  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  /* Claude Code 風格：狀態記號改單色字符（顏色由 --st-* token 決定，跟隨主題）。 */
  .sicon { font-size: 11px; line-height: 1; width: 12px; text-align: center; flex: none; }

  .columns { display: grid; grid-template-columns: minmax(320px, 5fr) minmax(360px, 7fr); gap: 16px; }
  @media (max-width: 900px) { .columns { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  .card-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .card-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .card-head .spacer { flex: 1; }
  .card-body { padding: 8px; }
  .card-body.pad { padding: 14px; }

  select {
    font: inherit; font-size: 12px; color: var(--text);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px;
  }
  select:hover { background: var(--hover); }
  /* 原生下拉清單的 option 不繼承 select 底色（Chromium 用 UA 白底），暗色會變白底白字；明確指定底色／字色。 */
  select option, select optgroup { color: var(--text); background-color: var(--card); }

  /* 樹 */
  .tree { max-height: 620px; overflow: auto; }
  .tnode { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .tnode:hover { background: var(--hover); }
  .tnode.selected { background: var(--selected); }
  .tnode .caret { width: 14px; color: var(--muted); flex: none; text-align: center; user-select: none; }
  .tnode .caret.leaf { visibility: hidden; }
  .tnode .label { overflow: hidden; text-overflow: ellipsis; }
  .tnode .type { color: var(--muted); font-size: 11px; }
  .tnode .owner { color: var(--muted); font-size: 11px; margin-left: auto; padding-left: 10px; }
  .tree .empty, .empty { color: var(--muted); padding: 10px; }

  /* 報告節點（F3）：樹上的計數小徽章＋詳情頁的報告列。報告預設收合在父節點下，
     不跟著一般子節點一起展開，避免（如 Y20260916）大批 done 報告把樹塞滿。 */
  .tbadge {
    font: inherit; font-size: 10px; color: var(--muted); background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 0 6px;
    margin-left: 6px; cursor: pointer; flex: none; line-height: 16px;
  }
  .tbadge:hover { color: var(--text); background: var(--hover); }
  .rrow { cursor: pointer; }
  .rrow .rtitle { color: var(--accent); }
  .rrow:hover .rtitle { text-decoration: underline; }
  .rrow .rmeta { color: var(--muted); font-size: 11px; }

  /* 詳情 */
  .detail { min-height: 620px; max-height: 620px; overflow: auto; }
  .kv { display: grid; grid-template-columns: 72px 1fr; gap: 4px 12px; margin-bottom: 12px; }
  .kv .k { color: var(--muted); }
  .kv .v { min-width: 0; overflow-wrap: anywhere; }
  .section-title { font-weight: 600; margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid var(--border); }
  .body-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-family: inherit; }
  .pill { display: inline-block; border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--muted); }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 3px 0; border-bottom: 1px solid var(--bg); overflow-wrap: anywhere; }
  ul.plain li:last-child { border-bottom: 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .ts { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* 焦點 */
  .focus { display: grid; grid-template-columns: 1fr; gap: 0; }
  /* .focus 自己的 display:grid 會蓋掉瀏覽器對 [hidden] 屬性的預設 display:none——
     不是 JS 沒切 tab，是這條 CSS 一直贏，導致切到其他分頁時焦點內容還是疊在畫面上。
     沒有這行的話 #progress/#checklist/#weekly 沒事，因為它們沒有另外設 display。 */
  .focus[hidden] { display: none; }
  .frow { display: grid; grid-template-columns: 132px 1fr; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .frow:last-child { border-bottom: 0; }
  .frow .flabel { color: var(--muted); }
  .frow .fbody { min-width: 0; }
  .fitem { padding: 2px 0; overflow-wrap: anywhere; }
  .fitem .owner, .fitem .note { color: var(--muted); }
  @media (max-width: 700px) { .frow { grid-template-columns: 1fr; gap: 4px; } }

  .tag-load { display: flex; flex-wrap: wrap; gap: 6px; }
  .error { color: var(--st-blocked); padding: 10px; }

  /* 進度／母表／週報（v0.3） */
  .bar { position: relative; height: 8px; border-radius: 4px; background: var(--hover); overflow: hidden; margin-top: 3px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .prow { padding: 6px 0; border-bottom: 1px solid var(--bg); }
  .prow:last-child { border-bottom: 0; }
  .prow .ptop { display: flex; align-items: baseline; gap: 8px; }
  .prow .ptop .note { color: var(--muted); }
  .prow .ptop .pct { margin-left: auto; font-variant-numeric: tabular-nums; }
  .clist { width: 100%; border-collapse: collapse; }
  .clist th, .clist td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--bg); vertical-align: top; }
  .clist th { color: var(--muted); font-weight: 500; }
  .clist td.key { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .clist td.owner, .clist td.issue { color: var(--muted); }
  .wblock { padding: 6px 0; }
  .wblock h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; }
  .wblock .empty { padding: 2px 0; }

  /* 分頁：焦點／進度／母表／週報（點擊展開、預設收合）。2026-09-22 導演要求跟展開的
     內容面板貼在一起，不要再跟內容差了一整個樹狀圖的距離，改成緊貼在 #panel 正上方。 */
  .tabs {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 0 8px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px 8px 0 0;
  }
  /* #panel 緊貼在 .tabs 正下方，兩者合成一塊（上邊框重疊、面板不再重複畫上方圓角）。 */
  #panel { border-top-left-radius: 0; border-top-right-radius: 0; margin-top: -1px; }
  .tab {
    font: inherit; font-size: 13px; color: var(--muted);
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 10px 12px; cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  /* 面板的「專案為根」分節標題（v0.3 多專案） */
  .proj-title {
    font-weight: 600; color: var(--accent);
    margin: 14px 0 2px; padding-bottom: 2px;
  }
  .proj-title:first-child { margin-top: 0; }

  /* ---- 即時動態（F2）：右下角浮動小卡，可收合成小圓鈕 ---- */
  .feed {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    width: 300px; max-width: calc(100vw - 32px);
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .18); overflow: hidden;
  }
  .feed-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .feed-head .feed-title { font-weight: 600; font-size: 12px; }
  .feed-head .spacer { flex: 1; }
  .feed-toggle {
    font: inherit; font-size: 14px; line-height: 1; color: var(--muted);
    background: none; border: 0; cursor: pointer; padding: 0 4px;
  }
  .feed-toggle:hover { color: var(--text); }
  .feed-list { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; }
  .feed-item {
    display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 10px;
    border-bottom: 1px solid var(--bg); font-size: 12px; cursor: pointer;
  }
  .feed-item:hover { background: var(--hover); }
  .feed-item .who { color: var(--accent); }
  .feed-item .nid { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); }
  /* 跨專案動態：左側小標籤顯示來源專案，跟目前專案的動態一眼區隔。 */
  .feed-item .proj {
    color: var(--accent); font-size: 10px; border: 1px solid var(--border);
    border-radius: 4px; padding: 0 4px; align-self: center;
  }
  .feed-item.foreign .nid { color: var(--accent); }
  .feed-empty { padding: 10px; color: var(--muted); font-size: 12px; }
  .feed-bubble {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%; padding: 0;
    background: var(--accent); color: #fff; border: 0; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 700;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
  }
  .feed-bubble:hover { filter: brightness(1.06); }

  /* ---- 變動閃爍（F2）：只用 CSS keyframes，JS 只加／移除 class ---- */
  @keyframes pb-flash-strong {
    0%   { background-color: transparent; }
    20%  { background-color: var(--flash); }
    100% { background-color: transparent; }
  }
  @keyframes pb-flash-soft {
    0%   { background-color: transparent; }
    20%  { background-color: var(--flash-parent); }
    100% { background-color: transparent; }
  }
  .pb-flash { animation: pb-flash-strong 1.2s ease-out; border-radius: 4px; }
  .pb-flash-parent { animation: pb-flash-soft 1.2s ease-out; border-radius: 4px; }
  /* 尊重系統設定：不做動畫，改成 2 秒靜態外框提示（JS 改以固定時長移除 class）。 */
  @media (prefers-reduced-motion: reduce) {
    .pb-flash { animation: none; box-shadow: inset 0 0 0 2px var(--accent); }
    .pb-flash-parent { animation: none; }
  }
</style>
<script>
/* 套用主題要在首次繪製前，避免閃爍（FOUC）：有存選擇用存的，沒存跟隨 prefers-color-scheme。 */
(function () {
  var dark = false;
  try {
    var saved = localStorage.getItem("pb-theme");
    if (saved === "dark") dark = true;
    else if (saved === "light") dark = false;
    else dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  } catch (e) {
    dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
})();
</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-mark" src="/assets/avatar.png" alt="" width="20" height="20">ProjectBoard</div>
    <div class="spacer"></div>
    <div class="meta">
      <span id="addr">127.0.0.1:8787</span>
      <span class="dot-sep">·</span>
      <span>更新 <span id="updated">--:--</span></span>
      <span class="dot-sep">·</span>
      <span id="live-status" class="live-status off" title="即時更新連線狀態">即時 <span class="live-dot">●</span></span>
      <button id="refresh" class="btn" type="button">重新整理</button>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換為暗色模式" title="切換為暗色模式">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="wrap">
    <section class="stats" aria-label="型別／狀態統計">
      <span id="typebar" style="display:contents"></span>
      <span id="statbar" style="display:contents"></span>
    </section>

    <div class="columns">
      <aside class="card">
        <div class="card-head">
          <h2>樹</h2>
          <div class="spacer"></div>
          <select id="f-project" aria-label="專案過濾"></select>
          <select id="f-owner" aria-label="負責人過濾"></select>
        </div>
        <div class="card-body">
          <div class="tree" id="tree"><div class="empty">載入中…</div></div>
        </div>
      </aside>

      <section class="card">
        <div class="card-head"><h2>詳情</h2></div>
        <div class="card-body pad detail" id="detail">
          <div class="empty">從左側選一張單</div>
        </div>
      </section>
    </div>

    <nav class="tabs" id="tabs" role="tablist" aria-label="面板切換" style="margin-top:16px">
      <button class="tab" type="button" role="tab" data-tab="focus" aria-selected="false"></button>
      <button class="tab" type="button" role="tab" data-tab="progress" aria-selected="false"></button>
      <button class="tab" type="button" role="tab" data-tab="checklist" aria-selected="false"></button>
      <button class="tab" type="button" role="tab" data-tab="weekly" aria-selected="false"></button>
    </nav>

    <section class="card" id="panel" hidden>
      <div class="card-head"><h2 id="panel-title"></h2></div>
      <div class="focus" id="focus" role="tabpanel" hidden><div class="empty">載入中…</div></div>
      <div class="card-body pad" id="progress" role="tabpanel" hidden><div class="empty">載入中…</div></div>
      <div class="card-body pad" id="checklist" role="tabpanel" hidden><div class="empty">載入中…</div></div>
      <div class="card-body pad" id="weekly" role="tabpanel" hidden><div class="empty">載入中…</div></div>
    </section>
  </div>

  <div id="feed" class="feed" hidden>
    <div class="feed-head">
      <span class="feed-title">即時動態</span>
      <span class="spacer"></span>
      <button id="feed-toggle" class="feed-toggle" type="button" aria-label="收合即時動態" title="收合">–</button>
    </div>
    <ul class="feed-list" id="feed-list"></ul>
  </div>
  <button id="feed-bubble" class="feed-bubble" type="button" aria-label="展開即時動態" title="即時動態" hidden>0</button>

<script>
"use strict";

/* 顯示 metadata（type／owner／status／tab）的唯一來源＝/api/meta（2026-09-22 學長指示：頁面不寫死清單）。
   FALLBACK_* 只在 API 載入失敗時當最低限度保底（fail-soft，比照 loadDeps/loadChecklist），正常路徑一律吃 API。 */
var FALLBACK_STATUS = {
  todo:        { key: "todo",        icon: "\u25cb", label: "未開始", color: "#5f6368" },
  in_progress: { key: "in_progress", icon: "\u25d0", label: "進行中", color: "#1a73e8" },
  review:      { key: "review",      icon: "\u25d1", label: "待驗收", color: "#f9ab00" },
  blocked:     { key: "blocked",     icon: "\u25cf", label: "卡住",   color: "#d93025" },
  hold:        { key: "hold",        icon: "\u25cc", label: "暫緩",   color: "#80868b" },
  done:        { key: "done",        icon: "\u2714", label: "完成",   color: "#188038" },
  cancel:      { key: "cancel",      icon: "\u2715", label: "不做",   color: "#9aa0a6" },
  archived:    { key: "archived",    icon: "\ud83d\udce6", label: "封存", color: "#795548" }
};
var FALLBACK_TABS = { focus: "\u7126\u9ede", progress: "\u9032\u5ea6", checklist: "\u6bcd\u8868", weekly: "\u9031\u5831" };
var FALLBACK_META = { types: [], owners: [], statuses: [], tabs: [] };
var LAST_VIEW_KEY = "pb-last-view";

var state = {
  tree: [],
  meta: { types: [], owners: [], statuses: [], tabs: [] },
  stats: null,
  deps: [],
  checklist: [],
  report: null,
  selected: null,
  expanded: {},
  // expandedReports：樹上「報告」小徽章的展開狀態（key＝父節點 id）。報告預設收合，
  // 不與一般子節點的 state.expanded 混用，才不會因為展開 ISSUE 就一次噴出全部報告。
  expandedReports: {},
  activeTab: null,
  suppressPush: false,
  filterProject: "",
  filterStatus: "",
  filterOwner: "",
  filterType: ""
};

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}

// statusList：狀態清單（依 /api/meta 的 sort）；API 失敗或空才退回本地備援。
function statusList() {
  var list = (state.meta && state.meta.statuses) || [];
  if (list.length) return list;
  return Object.keys(FALLBACK_STATUS).map(function (k) { return FALLBACK_STATUS[k]; });
}

function statusMeta(s) {
  var list = (state.meta && state.meta.statuses) || [];
  for (var i = 0; i < list.length; i++) if (list[i].key === s) return list[i];
  return FALLBACK_STATUS[s] || { key: s, icon: "\u25aa", label: s || "\u2014", color: "#9aa0a6" };
}

function statusDot(s, withLabel) {
  var meta = statusMeta(s);
  var wrap = el("span");
  wrap.style.display = "inline-flex";
  wrap.style.alignItems = "center";
  wrap.style.gap = "5px";
  var mark = el("span", "sicon", meta.icon);
  mark.style.color = "var(--st-" + s + ", " + meta.color + ")";
  wrap.appendChild(mark);
  if (withLabel) wrap.appendChild(el("span", null, meta.label));
  return wrap;
}

function getJSON(url) {
  return fetch(url, { headers: { "Accept": "application/json" }, cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error(url + " \u2192 HTTP " + r.status);
      return r.json();
    });
}

function fmtTime(ts) {
  if (!ts) return "--:--";
  var d = new Date(ts);
  if (isNaN(d.getTime())) return ts;
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return p(d.getHours()) + ":" + p(d.getMinutes());
}

function fmtDate(ts) {
  if (!ts) return "";
  var d = new Date(ts);
  if (isNaN(d.getTime())) return String(ts).slice(0, 10);
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function setUpdated() {
  var now = new Date();
  document.getElementById("updated").textContent = fmtTime(now.toISOString());
  document.getElementById("addr").textContent = location.host || "127.0.0.1:8787";
}

/* ---- facet 計數：算某個欄位(status/type)的分布時，套用「除了該欄位本身以外」目前生效中的篩選 ----
   這樣狀態列/型別列上的數字永遠等於「點下去之後樹會出現幾筆」，不會出現 chip 寫著一個數字、
   點下去卻因為跟其他篩選條件交集而變空的矛盾。 */
function facetMatches(n, excludeField, hideDone) {
  if (state.filterProject && excludeField !== "project" && projectOf(n.id) !== state.filterProject) return false;
  if (state.filterStatus && excludeField !== "status" && n.status !== state.filterStatus) return false;
  if (state.filterOwner && excludeField !== "owner" && n.owner !== state.filterOwner) return false;
  if (state.filterType && excludeField !== "type" && n.type !== state.filterType) return false;
  // hideDone：只有在「沒有另外明講要看哪個狀態」時才排除done／archived（archived是done的封存態，
  // 待遇比照done）。使用者一旦自己點了狀態chip(含「完成」「封存」)，就是他自己選的，不再幫他
  // 偷偷過濾——這是型別列專用，狀態列不吃這個參數。
  if (hideDone && !state.filterStatus && (n.status === "done" || n.status === "archived")) return false;
  if (excludeField === "status" && reportOutOfStatusFacet(n)) return false;
  return true;
}

// reportOutOfStatusFacet：報告（type=report）是文件不是工作項，建立後預設 todo 也不會有人去轉狀態；
// 樹上又只以父節點的「報告 N」徽章呈現、不會單獨成列。所以除非使用者明講只看報告型別，
// 報告不進狀態列計數、也不單獨吃狀態篩選——否則會出現「未開始 5」點下去卻全是完成節點的矛盾。
function reportOutOfStatusFacet(n) {
  return isReportNode(n) && state.filterType !== "report";
}

function countByField(nodes, field, excludeField, counts, hideDone) {
  (nodes || []).forEach(function (n) {
    if (n && n[field] && facetMatches(n, excludeField, hideDone)) counts[n[field]] = (counts[n[field]] || 0) + 1;
    if (n && n.children && n.children.length) countByField(n.children, field, excludeField, counts, hideDone);
  });
  return counts;
}

/* ---- 統計列（可點：點狀態＝下面只顯示該類；「全部」在最前面） ---- */
function renderStats() {
  var bar = document.getElementById("statbar");
  bar.textContent = "";
  var counts = countByField(state.tree, "status", "status", {});
  var order = statusList().map(function (st) { return st.key; });
  var total = 0;
  order.forEach(function (s) { total += counts[s] || 0; });
  bar.appendChild(statChip("", "全部", total, false));
  order.forEach(function (s) {
    bar.appendChild(statChip(s, statusMeta(s).label, counts[s] || 0, true));
  });
}

// numBadge：手機未讀數字風格的小圓角標——貼在 chip 右上角；0 就不生（不畫空殼）。
function numBadge(num) {
  if (!num) return null;
  return el("span", "badge", num);
}

// statChip：status="" 代表「全部」（清除狀態過濾）。有 dot 才畫狀態點。
function statChip(status, label, num, withDot) {
  var chip = el("button", "chip stat-chip");
  chip.type = "button";
  chip.setAttribute("data-status", status);
  if ((state.filterStatus || "") === status) chip.className += " active";
  if (withDot) chip.appendChild(statusDot(status, false));
  chip.appendChild(el("span", null, label));
  var badge = numBadge(num);
  if (badge) chip.appendChild(badge);
  chip.addEventListener("click", function () { setStatusFilter(status); });
  return chip;
}

function setStatusFilter(status) {
  state.filterStatus = status;
  pushURL();
  renderStats();
  renderTypeStats();
  renderTree();
}

/* ---- 型別統計列（跟狀態列同級：一眼看到各型別張數，點可篩選；純前端算，直接數 state.tree）---- */
function renderTypeStats() {
  var bar = document.getElementById("typebar");
  if (!bar) return;
  bar.textContent = "";
  var types = (state.meta && state.meta.types) || [];
  if (!types.length) return;
  var counts = countByField(state.tree, "type", "type", {}, true);
  var total = 0;
  types.forEach(function (t) { total += counts[t.key] || 0; });
  bar.appendChild(typeChip("", "全部型別", total));
  types.forEach(function (t) {
    bar.appendChild(typeChip(t.key, t.label, counts[t.key] || 0));
  });
  bar.appendChild(doneBugButton());
}

// doneBugButton：型別列預設排除done，已完成的BUG因此看不到——這顆是明講的捷徑，
// 效果等於「先點完成狀態chip、再點BUG型別chip」兩下，不做別的事，方便直接跳過去看。
function doneBugButton() {
  var btn = el("button", "chip stat-chip");
  btn.type = "button";
  if (state.filterType === "bug" && state.filterStatus === "done") btn.className += " active";
  btn.appendChild(el("span", null, "已完成的BUG"));
  btn.addEventListener("click", function () {
    state.filterType = "bug";
    state.filterStatus = "done";
    pushURL();
    renderStats();
    renderTypeStats();
    renderTree();
  });
  return btn;
}

function typeChip(type, label, num) {
  var chip = el("button", "chip stat-chip");
  chip.type = "button";
  chip.setAttribute("data-type", type);
  if ((state.filterType || "") === type) chip.className += " active";
  chip.appendChild(el("span", null, label));
  var badge = numBadge(num);
  if (badge) chip.appendChild(badge);
  chip.addEventListener("click", function () { setTypeFilter(type); });
  return chip;
}

function setTypeFilter(type) {
  state.filterType = type;
  renderTypeStats();
  renderStats();
  renderTree();
}

/* ---- 過濾器（樹/專案、負責人；狀態與型別已改由上面的 chip 列單一控制，這裡不重複） ---- */
function renderFilters() {
  var fp = document.getElementById("f-project");
  fp.textContent = "";
  fp.appendChild(new Option("全部專案", ""));
  (state.tree || []).forEach(function (n) {
    if (!n || !n.id) return;
    fp.appendChild(new Option(n.title ? n.id + " — " + n.title : n.id, n.id));
  });
  fp.value = state.filterProject;

  var fo = document.getElementById("f-owner");
  fo.textContent = "";
  fo.appendChild(new Option("全部負責人", ""));
  ((state.meta && state.meta.owners) || []).forEach(function (o) { fo.appendChild(new Option(o, o)); });
  fo.value = state.filterOwner;
}

function projectOf(id) {
  var s = String(id || "");
  var i = s.indexOf("/");
  return i < 0 ? s : s.slice(0, i);
}

/* ---- 報告節點（type=report）共用工具（F3） ---- */
function isReportNode(n) { return !!n && n.type === "report"; }
// reportChildren：node 的直接子節點中，type=report 者（收工／檢討報告）。
function reportChildren(node) {
  return ((node && node.children) || []).filter(isReportNode);
}
// nonReportChildren：一般子節點（ISSUE／REQ…），報告另立一區，不混在「子節點」裡。
function nonReportChildren(node) {
  return ((node && node.children) || []).filter(function (c) { return !isReportNode(c); });
}
// findNodeById：在 state.tree 中 DFS 找節點（畫報告、判斷型別用）。
function findNodeById(id) {
  var stack = (state.tree || []).slice();
  while (stack.length) {
    var n = stack.pop();
    if (!n) continue;
    if (n.id === id) return n;
    var kids = n.children || [];
    for (var i = 0; i < kids.length; i++) stack.push(kids[i]);
  }
  return null;
}

// projectTitle：專案 id → 顯示名（id — title；找不到就回 id）。
function projectTitle(pid) {
  var nodes = state.tree || [];
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i] && nodes[i].id === pid) {
      return nodes[i].title ? pid + " \u2014 " + nodes[i].title : pid;
    }
  }
  return pid;
}

// groupByProject：把一批節點依「所屬專案（id 前綴）」分組，回傳 [{key, items}]，key 排序。
// 專案是報表的根（2026-09-20 學長指示）：全部模式也要分得開，不混成一張。
function groupByProject(items, idOf) {
  var by = {}, order = [];
  (items || []).forEach(function (x) {
    var p = projectOf(idOf(x));
    if (!by[p]) { by[p] = []; order.push(p); }
    by[p].push(x);
  });
  order.sort();
  return order.map(function (p) { return { key: p, items: by[p] }; });
}

/* ---- SPA deep-link：每個點選都反映到 URL（可直接貼連結開到該畫面） ---- */
// URL 結構：`/`｜`/<project>`｜`/<project>/<…node id…>`，查詢 `?tab=<focus|progress|checklist|weekly>&status=<s>`。

// readURL：把 location 解回 state（載入與 popstate 用）。`/all`＝全部專案。
function readURL() {
  var seg = location.pathname.split("/").filter(function (x) { return x !== ""; });
  var q = new URLSearchParams(location.search);
  if (seg.length === 0 || seg[0] === "all") {
    state.filterProject = "";
    state.selected = null;
  } else {
    state.filterProject = seg[0];
    // 只給到專案(沒有更深的節點)時，預設選定專案本身，右側詳情才不會空著
    // （2026-09-22 導演要求：直接連到 /Y20260916 右邊要直接有內容，不要空白很難看）。
    state.selected = seg.length > 1 ? seg.join("/") : seg[0];
    state.expanded[state.filterProject] = true;
  }
  // 網址沒帶 tab 參數時預設開「焦點」，不要維持全部收合——這是「進入畫面」的預設值，
  // 網址明講 tab=xxx（含記住的上次畫面）或使用者手動收合過都照舊尊重，不會被這裡蓋掉
  // （2026-09-23 導演要求）。
  state.activeTab = q.get("tab") || "focus";
  state.filterStatus = q.get("status") || "";
}

// currentPath：state → 路徑字串（全部專案＝/all）。
function currentPath() {
  if (state.selected) return "/" + state.selected;
  if (state.filterProject) return "/" + state.filterProject;
  return "/all";
}

// pushURL：把目前 state 寫進網址列（replace=true 則取代，不新增歷史）。
function pushURL(replace) {
  var q = [];
  if (state.activeTab) q.push("tab=" + encodeURIComponent(state.activeTab));
  if (state.filterStatus) q.push("status=" + encodeURIComponent(state.filterStatus));
  var url = currentPath() + (q.length ? "?" + q.join("&") : "");
  // 記住這一頁，重開/回來時(進根網址`/`)直接還原上次離開的畫面，不用每次都回到
  // 預設第一個專案（2026-09-22 導演要求：上次在看哪個issue，關掉再回來要一樣）。
  // 這行故意放在 suppressPush 判斷之前：restoreView() 還原深連結時也會設
  // suppressPush(避免污染瀏覽器歷史)，但「記住看過什麼」跟「要不要動歷史」是兩件事，
  // 深連結進來一樣要記住，不能因為suppressPush就沒存到。
  try { localStorage.setItem(LAST_VIEW_KEY, url); } catch (e) { /* 私密瀏覽等環境忽略 */ }
  if (state.suppressPush) return;
  try {
    if (replace) history.replaceState(null, "", url);
    else history.pushState(null, "", url);
  } catch (e) { /* file:// 等環境忽略 */ }
}

function matches(n) {
  if (state.filterProject && projectOf(n.id) !== state.filterProject) return false;
  if (state.filterStatus && n.status !== state.filterStatus) return false;
  if (state.filterStatus && reportOutOfStatusFacet(n)) return false;
  if (state.filterOwner && n.owner !== state.filterOwner) return false;
  if (state.filterType && n.type !== state.filterType) return false;
  // 跟型別列的 hideDone 對齊：點了型別chip、但沒另外指定狀態時，done／archived不出現在樹裡，
  // 不然型別chip數字(已排除done／archived)會跟樹的結果對不上。
  if (state.filterType && !state.filterStatus && (n.status === "done" || n.status === "archived")) return false;
  return true;
}

function filterTree(nodes) {
  var out = [];
  (nodes || []).forEach(function (n) {
    var kids = filterTree(n.children || []);
    if (matches(n) || kids.length) {
      // 報告跟著父節點一起出現：報告多半是 done，狀態篩選（例：只看 in_progress）
      // 不該把父節點底下的報告整批濾掉——父節點還在，它的報告就跟著在。
      // 但使用者若明講只看某個型別（filterType），就不硬塞報告進去。
      if (!state.filterType) {
        var seen = {};
        kids.forEach(function (k) { seen[k.id] = true; });
        (n.children || []).forEach(function (c) {
          if (isReportNode(c) && !seen[c.id]) {
            kids.push({ id: c.id, type: c.type, title: c.title, status: c.status, owner: c.owner, children: [] });
            seen[c.id] = true;
          }
        });
      }
      out.push({ id: n.id, type: n.type, title: n.title, status: n.status, owner: n.owner, children: kids });
    }
  });
  return out;
}

// expandFilteredBranches：filterTree篩完之後，凡是還帶著children的節點都是「通往符合條件
// 項目的路上」，直接展開，不用使用者再一層一層點caret——點型別/狀態/負責人chip篩選，
// 就是想直接看到結果，不是篩完還要自己手動展開。
function expandFilteredBranches(nodes) {
  (nodes || []).forEach(function (n) {
    if (n.children && n.children.length) {
      state.expanded[n.id] = true;
      // 明講看報告型別時，報告就是篩選結果本身，徽章直接展開，不然只看到父節點。
      if (state.filterType === "report" && n.children.some(isReportNode)) state.expandedReports[n.id] = true;
      expandFilteredBranches(n.children);
    }
  });
}

/* ---- 樹 ---- */
function renderTree() {
  var host = document.getElementById("tree");
  host.textContent = "";
  var nodes = state.tree;
  if (state.filterStatus || state.filterOwner || state.filterType) {
    nodes = filterTree(nodes);
    expandFilteredBranches(nodes);
  } else if (state.filterProject) {
    nodes = filterTree(nodes);
  }
  if (!nodes.length) { host.appendChild(el("div", "empty", "\u7121符合條件的節點")); return; }
  nodes.forEach(function (n) { host.appendChild(treeRow(n, 0)); });
}

function treeRow(node, depth) {
  var frag = document.createDocumentFragment();
  var row = el("div", "tnode");
  row.setAttribute("data-node-id", node.id); // 供即時變動閃爍（F2）用 id 找到對應列
  if (state.selected === node.id) row.className += " selected";
  row.style.paddingLeft = (6 + depth * 16) + "px";

  var kids = node.children || [];
  // 報告（type=report）不跟一般子節點一起展開：預設收合，改用行內小徽章單獨展開，
  // 免得一個節點底下掛了一堆 done 報告，一展開就把樹淹掉。
  var reportKids = kids.filter(isReportNode);
  var normalKids = kids.filter(function (c) { return !isReportNode(c); });
  var caret = el("span", "caret" + (normalKids.length ? "" : " leaf"), normalKids.length ? (state.expanded[node.id] ? "\u25be" : "\u25b8") : "\u25b8");
  row.appendChild(caret);
  row.appendChild(statusDot(node.status, false));
  row.appendChild(el("span", "label", node.title || node.id));
  if (reportKids.length) {
    var badge = el("button", "tbadge");
    badge.type = "button";
    badge.textContent = "報告 " + reportKids.length;
    badge.title = "展開／收合報告";
    badge.setAttribute("data-report-count", String(reportKids.length));
    badge.addEventListener("click", function (ev) {
      ev.stopPropagation();
      state.expandedReports[node.id] = !state.expandedReports[node.id];
      renderTree();
    });
    row.appendChild(badge);
  }
  row.appendChild(el("span", "type", node.type || ""));
  row.appendChild(el("span", "owner", node.owner || ""));

  caret.addEventListener("click", function (ev) {
    ev.stopPropagation();
    if (!normalKids.length) return;
    state.expanded[node.id] = !state.expanded[node.id];
    renderTree();
  });
  row.addEventListener("click", function () { selectNode(node.id); });
  frag.appendChild(row);

  if (normalKids.length && state.expanded[node.id]) {
    normalKids.forEach(function (c) { frag.appendChild(treeRow(c, depth + 1)); });
  }
  if (reportKids.length && state.expandedReports[node.id]) {
    reportKids.forEach(function (c) { frag.appendChild(treeRow(c, depth + 1)); });
  }
  return frag;
}

/* 樹預設收合，但目前選定的專案根節點例外：選定專案時(readURL/loadAll預設專案/f-project切換)
   會把 state.expanded[filterProject] 設 true，主tree直接展開好，不用先點一下caret。
   其餘節點(專案底下的子節點)還是預設收合，不做整棵樹遞迴全展開（2026-09-20 學長原本的收合
   設計；2026-09-22 導演要求選定專案的主tree改成預設展開，見上面三處 state.expanded 賦值）。 */

/* ---- 詳情 ---- */

// findPath：在樹中由根往 DFS 找 id 的祖先鏈（含 id 本身，根在前）；找不到回 null。
function findPath(nodes, id) {
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.id === id) return [n.id];
    var kids = n.children || [];
    if (kids.length) {
      var sub = findPath(kids, id);
      if (sub) return [n.id].concat(sub);
    }
  }
  return null;
}

// expandAncestors：只把 id 的祖先鏈設為展開（不是整棵樹遞迴全展開，子節點還是預設收合）。
// 2026-09-22 P0 修（ISSUE-TREE-AUTOEXPAND-SELECTED）：深連結／上一頁還原時若祖先收合，
// 選中節點在左樹看不到（右側卻已顯示），看起來像整頁空白 → 選取時自動展開其祖先。
function expandAncestors(id) {
  var path = findPath(state.tree, id);
  if (!path) return;
  for (var i = 0; i < path.length - 1; i++) state.expanded[path[i]] = true;
}

function selectNode(id) {
  state.selected = id;
  expandAncestors(id);
  // 選到報告時，順手把它在樹上的報告徽章展開，免得右邊顯示了報告、左邊樹卻看不到它。
  if (isReportNode(findNodeById(id))) {
    var path = findPath(state.tree, id);
    if (path && path.length >= 2) state.expandedReports[path[path.length - 2]] = true;
  }
  pushURL();
  renderTree();
  return loadDetail(id);
}

// encodePath：把節點 id（含 `/`）逐段 URL-encode，保留分隔斜線（沿用既有寫法）。
function encodePath(id) {
  return id.split("/").map(encodeURIComponent).join("/");
}

// loadDetail：載入並繪製某節點的詳情（節點＋history＋專案 repo）。純繪製，不動 URL／樹。
// 初始選取（selectNode）與即時事件更新（F1，節點被改到時）共用同一條路徑。
function loadDetail(id) {
  var host = document.getElementById("detail");
  host.textContent = "";
  host.appendChild(el("div", "empty", "載入中…"));
  var enc = encodePath(id);
  var pid = projectOf(id);
  var projReq = (pid && pid !== id)
    ? getJSON("/api/node/" + encodeURIComponent(pid)).catch(function () { return null; })
    : Promise.resolve(null);
  return Promise.all([
    getJSON("/api/node/" + enc),
    getJSON("/api/node/" + enc + "/history").catch(function () { return []; }),
    projReq
  ]).then(function (res) {
    renderDetail(res[0], res[1], repoURLOf(res[2]));
  }).catch(function (err) {
    host.textContent = "";
    host.appendChild(el("div", "error", "載入失敗：" + err.message));
  });
}

// repoURLOf：從（project）節點的 links 取 repo URL（kind=repo）。
function repoURLOf(projectNode) {
  if (!projectNode || !projectNode.links) return "";
  for (var i = 0; i < projectNode.links.length; i++) {
    if (projectNode.links[i].kind === "repo") return projectNode.links[i].target;
  }
  return "";
}

// linkURL：commit／pr 依 project repo 組出可點連結（其他 kind 或沒 repo 回空）。
function linkURL(repo, l) {
  if (!repo) return "";
  var base = repo.replace(/\.git$/, "");
  if (l.kind === "commit") return base + "/commit/" + l.target;
  if (l.kind === "pr") return /^https?:/.test(l.target) ? l.target : base + "/pull/" + l.target;
  return "";
}

// reportRow：詳情頁「報告」區塊的一列——先顯示報告 id，抓到節點後補上標題／owner／日期；
// 點一列＝選取該報告節點，右側載入它的完整內容（markdown body）。fail-soft：抓不到維持 id。
function reportRow(child) {
  var li = el("li", "rrow");
  li.setAttribute("data-report-id", child.id);
  var title = el("div", "rtitle", child.id);
  var meta = el("div", "rmeta", "");
  li.appendChild(title);
  li.appendChild(meta);
  li.addEventListener("click", function () { selectNode(child.id); });
  getJSON("/api/node/" + child.id.split("/").map(encodeURIComponent).join("/"))
    .then(function (rep) {
      if (!document.body.contains(li)) return; // 已換頁，別把內容補到別的詳情裡
      if (rep && rep.title) title.textContent = rep.title;
      var parts = [];
      if (rep && rep.owner) parts.push(rep.owner);
      if (rep && rep.created_at) parts.push(fmtDate(rep.created_at));
      meta.textContent = parts.join(" \u00b7 ");
    })
    .catch(function () {});
  return li;
}

function renderDetail(node, history, repoURL) {
  var host = document.getElementById("detail");
  host.textContent = "";

  var title = el("div");
  title.style.fontSize = "15px";
  title.style.fontWeight = "600";
  title.style.marginBottom = "4px";
  title.textContent = node.title || node.id;
  host.appendChild(title);
  host.appendChild(el("div", "mono", node.id));

  var kv = el("div", "kv");
  kv.style.marginTop = "12px";
  function kvrow(k, v) {
    kv.appendChild(el("div", "k", k));
    kv.appendChild(v instanceof Node ? cellWrap(v) : el("div", "v", v));
  }
  function cellWrap(n) { var d = el("div", "v"); d.appendChild(n); return d; }

  kvrow("狀態", statusDot(node.status, true));
  kvrow("負責", node.owner || "\u2014");
  kvrow("優先", node.priority || "\u2014");
  kvrow("標籤", node.tags || "\u2014");
  host.appendChild(kv);

  host.appendChild(el("div", "section-title", "body"));
  var body = el("pre", "body-text", node.body || "\u2014");
  host.appendChild(body);

  host.appendChild(el("div", "section-title", "關聯"));
  var links = node.links || [];
  if (!links.length) {
    host.appendChild(el("div", "empty", "\u7121"));
  } else {
    var ul = el("ul", "plain");
    links.forEach(function (l) {
      var li = el("li");
      li.appendChild(el("span", "pill", l.kind));
      li.appendChild(document.createTextNode(" "));
      var url = linkURL(repoURL, l);
      if (url) {
        var a = el("a", "mono", l.target);
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener";
        li.appendChild(a);
      } else {
        li.appendChild(el("span", "mono", l.target));
      }
      if (l.note) li.appendChild(el("span", "note", " \u2014 " + l.note));
      ul.appendChild(li);
    });
    host.appendChild(ul);
  }

  host.appendChild(el("div", "section-title", "子節點"));
  var kids = nonReportChildren(node);
  if (!kids.length) {
    host.appendChild(el("div", "empty", "\u7121"));
  } else {
    var kl = el("ul", "plain");
    kids.forEach(function (c) {
      var li = el("li");
      li.appendChild(statusDot(c.status, false));
      li.appendChild(document.createTextNode(" "));
      li.appendChild(el("span", "mono", c.id));
      kl.appendChild(li);
    });
    host.appendChild(kl);
  }

  // 報告區塊（F3）：直接子節點中 type=report 者（收工／檢討報告），列標題／owner／日期，
  // 點一下載入該報告全文。報告不混進「子節點」列，才不會被一串 id 淹掉。
  var reports = reportChildren(node);
  if (reports.length) {
    host.appendChild(el("div", "section-title", "報告（" + reports.length + "）"));
    var rl = el("ul", "plain");
    reports.forEach(function (c) { rl.appendChild(reportRow(c)); });
    host.appendChild(rl);
  }

  host.appendChild(el("div", "section-title", "歷史"));
  if (!history.length) {
    host.appendChild(el("div", "empty", "\u7121"));
  } else {
    var hl = el("ul", "plain");
    history.forEach(function (h) {
      var li = el("li");
      li.appendChild(el("span", "ts", fmtTime(h.ts)));
      li.appendChild(document.createTextNode("  "));
      li.appendChild(el("span", "pill", h.action || ""));
      li.appendChild(document.createTextNode(" " + (h.actor || "") + " "));
      var trans = (h.from_val || h.to_val) ? (h.from_val + " \u2192 " + h.to_val) : "";
      if (trans) li.appendChild(el("span", "mono", trans + " "));
      if (h.note) li.appendChild(el("span", "note", h.note));
      hl.appendChild(li);
    });
    host.appendChild(hl);
  }
}

/* ---- 焦點面板（五項） ---- */
function renderFocus() {
  var host = document.getElementById("focus");
  host.textContent = "";
  var stats = state.stats || {};
  var focus = stats.focus || {};
  var owners = stats.count_by_owner || {};

  function row(icon, label, build) {
    var r = el("div", "frow");
    r.appendChild(el("div", "flabel", icon + " " + label));
    var b = el("div", "fbody");
    build(b);
    r.appendChild(b);
    host.appendChild(r);
  }
  function emptyItem() { return el("span", "empty", "\u7121"); }
  function item(main, sub) {
    var d = el("div", "fitem");
    d.appendChild(el("span", null, main));
    if (sub) { d.appendChild(document.createTextNode(" ")); d.appendChild(el("span", "note", sub)); }
    return d;
  }

  row("\ud83d\udea7", "卡點", function (b) {
    var list = focus.blocked || [];
    if (!list.length) { b.appendChild(emptyItem()); return; }
    list.forEach(function (x) {
      b.appendChild(item("\u2013 " + (x.title || x.id), (x.reason ? "\uff08" + x.reason + "\uff09" : "")));
    });
  });

  row("\ud83d\udd17", "依賴", function (b) {
    var list = state.deps || [];
    if (!list.length) { b.appendChild(emptyItem()); return; }
    list.forEach(function (x) {
      b.appendChild(item("\u2013 " + (x.from_id || "") + " \u2192 " + (x.target || ""), x.note ? "\uff08" + x.note + "\uff09" : ""));
    });
  });

  row("\u2753", "待裁示", function (b) {
    var list = focus.awaiting_decision || [];
    if (!list.length) { b.appendChild(emptyItem()); return; }
    list.forEach(function (x) {
      b.appendChild(item("\u2013 " + (x.title || x.id), x.note ? "\uff08" + x.note + "\uff09" : ""));
    });
  });

  row("\ud83d\udd52", "最近異動", function (b) {
    var list = focus.recent || [];
    if (!list.length) { b.appendChild(emptyItem()); return; }
    list.forEach(function (x) {
      b.appendChild(item(fmtTime(x.ts) + " " + (x.actor || "") + " " + (x.summary || x.node_id || "")));
    });
  });

  row("\ud83d\udc64", "每人手上張數", function (b) {
    var wrap = el("div", "tag-load");
    ((state.meta && state.meta.owners) || []).forEach(function (o) {
      var chip = el("span", "chip");
      chip.appendChild(el("span", "num", owners[o] || 0));
      chip.appendChild(el("span", null, o));
      wrap.appendChild(chip);
    });
    b.appendChild(wrap);
  });

  row("\u26a0", "自我驗收", function (b) {
    var count = stats.self_verified_count;
    if (count === undefined || count === null) count = (focus.self_verified || []).length;
    var head = el("div", "fitem");
    head.appendChild(el("span", null, "\u5171 " + count + " 張（actor = owner）"));
    b.appendChild(head);
    (focus.self_verified || []).forEach(function (x) {
      b.appendChild(item("\u2013 " + (x.title || x.id), x.note ? "\uff08" + x.note + "\uff09" : ""));
    });
  });
}

/* ---- 進度（v0.3：REQ 完成度、每人手上張數、平均滯留天數） ---- */
function renderProgress() {
  var host = document.getElementById("progress");
  host.textContent = "";
  var stats = state.stats || {};
  var prog = stats.req_progress || {};
  var owners = stats.count_by_owner || {};
  var dwell = stats.avg_dwell_days || {};

  host.appendChild(el("div", "section-title", "REQ 完成度"));
  var ids = Object.keys(prog).sort();
  if (!ids.length) {
    host.appendChild(el("div", "empty", "\u7121"));
  } else {
    groupByProject(ids, function (id) { return id; }).forEach(function (g) {
      host.appendChild(el("div", "proj-title", projectTitle(g.key)));
      g.items.forEach(function (id) {
        var pct = Math.round((prog[id] || 0) * 100);
        var row = el("div", "prow");
        var top = el("div", "ptop");
        top.appendChild(el("span", "mono", id));
        top.appendChild(el("span", "pct", pct + "%"));
        row.appendChild(top);
        var bar = el("div", "bar");
        var fill = el("i");
        fill.style.width = pct + "%";
        bar.appendChild(fill);
        row.appendChild(bar);
        host.appendChild(row);
      });
    });
  }

  host.appendChild(el("div", "section-title", "每人手上張數與平均滯留天數"));
  var wrap = el("div", "tag-load");
  ((state.meta && state.meta.owners) || []).forEach(function (o) {
    var chip = el("span", "chip");
    chip.appendChild(el("span", "num", owners[o] || 0));
    chip.appendChild(el("span", null, o));
    if (dwell[o] !== undefined && dwell[o] !== null) {
      chip.appendChild(el("span", "note", "\u6eff留 " + dwell[o] + " \u5929"));
    }
    wrap.appendChild(chip);
  });
  host.appendChild(wrap);
}

/* ---- 母表（v0.3：依 KEY 首字母分組） ---- */
function renderChecklist() {
  var host = document.getElementById("checklist");
  host.textContent = "";
  var rows = state.checklist || [];
  if (!rows.length) {
    host.appendChild(el("div", "empty", "\u7121"));
    return;
  }
  groupByProject(rows, function (r) { return r.item_id; }).forEach(function (g) {
    host.appendChild(el("div", "proj-title", projectTitle(g.key)));
    renderChecklistRows(host, g.items);
  });
}

// renderChecklistRows：一批（同一專案的）母表列，依 KEY 首字母分組畫表。
function renderChecklistRows(host, rows) {
  var byLetter = {};
  var letters = [];
  rows.forEach(function (r) {
    var l = (r.key || "?").slice(0, 1);
    if (!byLetter[l]) { byLetter[l] = []; letters.push(l); }
    byLetter[l].push(r);
  });
  letters.sort();
  letters.forEach(function (l) {
    host.appendChild(el("div", "section-title", l));
    var table = el("table", "clist");
    var thead = el("thead");
    var hr = el("tr");
    ["\u7de8\u865f", "\u6a19\u984c", "\u72c0\u614b", "Owner", "\u6307\u5411"].forEach(function (h) {
      hr.appendChild(el("th", null, h));
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = el("tbody");
    byLetter[l].forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", "key", r.key || ""));
      tr.appendChild(el("td", null, r.title || ""));
      var stCell = el("td", null, "");
      stCell.appendChild(statusDot(r.status, true));
      tr.appendChild(stCell);
      tr.appendChild(el("td", "owner", r.owner || ""));
      tr.appendChild(el("td", "issue mono", r.issue_id || "\u2014"));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    host.appendChild(table);
  });
}

/* ---- 週報（v0.3：誰做了什麼／收了什麼／還開著什麼） ---- */
function renderWeekly() {
  var host = document.getElementById("weekly");
  host.textContent = "";
  var rep = state.report;
  if (!rep) {
    host.appendChild(el("div", "empty", "\u7121"));
    return;
  }
  host.appendChild(el("div", "section-title",
    "\u9031\u671f " + fmtDate(rep.week_start) + " ~ " + fmtDate(rep.week_end) + "\uff08Asia/Taipei\uff09"));

  // 專案是根：把三塊資料依所屬專案分節（全部模式也分得開）。
  var groups = groupByProject(
    (rep.did || []).map(function (h) { return h.node_id; })
      .concat((rep.closed || []).map(function (h) { return h.node_id; }))
      .concat((rep.open || []).map(function (n) { return n.id; })),
    function (x) { return x; }
  );
  if (!groups.length) {
    host.appendChild(el("div", "empty", "\u7121"));
    return;
  }

  function block(title, list, build) {
    var b = el("div", "wblock");
    b.appendChild(el("h3", null, title + "\uff08" + list.length + "\uff09"));
    if (!list.length) {
      b.appendChild(el("div", "empty", "\uff08\u7121\uff09"));
      host.appendChild(b);
      return;
    }
    var ul = el("ul", "plain");
    list.forEach(function (x) {
      var li = el("li");
      build(li, x);
      ul.appendChild(li);
    });
    b.appendChild(ul);
    host.appendChild(b);
  }

  function didRow(li, h) {
    li.appendChild(el("span", "ts", fmtTime(h.ts)));
    li.appendChild(document.createTextNode(" " + (h.actor || "") + " "));
    li.appendChild(el("span", "pill", h.action || ""));
    var trans = (h.from_val || h.to_val) ? (h.from_val + " \u2192 " + h.to_val) : "";
    if (trans) li.appendChild(el("span", "mono", " " + trans));
    if (h.note) li.appendChild(el("span", "note", " " + h.note));
  }
  function closedRow(li, h) {
    li.appendChild(el("span", "ts", fmtTime(h.ts)));
    li.appendChild(document.createTextNode(" " + (h.actor || "") + " "));
    li.appendChild(el("span", "mono", h.node_id || ""));
    if (h.note) li.appendChild(el("span", "note", " " + h.note));
  }
  function openRow(li, n) {
    li.appendChild(statusDot(n.status, false));
    li.appendChild(document.createTextNode(" "));
    li.appendChild(el("span", "mono", n.id || ""));
    li.appendChild(document.createTextNode(" " + (n.owner || "") + " "));
    li.appendChild(el("span", null, n.title || ""));
  }

  groups.forEach(function (g) {
    host.appendChild(el("div", "proj-title", projectTitle(g.key)));
    block("\u8ab0\u505a\u4e86\u4ec0\u9ebc", (rep.did || []).filter(function (h) { return projectOf(h.node_id) === g.key; }), didRow);
    block("\u6536\u4e86\u4ec0\u9ebc", (rep.closed || []).filter(function (h) { return projectOf(h.node_id) === g.key; }), closedRow);
    block("\u9084\u958b\u8457\u4ec0\u9ebc", (rep.open || []).filter(function (n) { return projectOf(n.id) === g.key; }), openRow);
  });
}

/* ---- header 分頁（焦點／進度／母表／週報；預設收合，點 tab 才展開與載入） ---- */
// tabLabel：分頁標題（依 /api/meta 的 tabs）；API 失敗才退回本地備援。
function tabLabel(id) {
  var list = (state.meta && state.meta.tabs) || [];
  for (var i = 0; i < list.length; i++) if (list[i].key === id) return list[i].label;
  return FALLBACK_TABS[id] || id;
}

// renderTabs：用 /api/meta 的 tabs 覆寫 header 分頁按鈕文字（頁面不寫死）。
function renderTabs() {
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (btn) {
    btn.textContent = tabLabel(btn.getAttribute("data-tab"));
  });
}

var extrasLoaded = false;

function setActiveTab(id) {
  ["focus", "progress", "checklist", "weekly"].forEach(function (p) {
    var panel = document.getElementById(p);
    if (panel) panel.hidden = p !== id;
    var btn = document.querySelector('.tab[data-tab="' + p + '"]');
    if (btn) {
      btn.classList.toggle("active", p === id);
      btn.setAttribute("aria-selected", p === id ? "true" : "false");
    }
  });
  var card = document.getElementById("panel");
  if (card) card.hidden = id === null;
  var title = document.getElementById("panel-title");
  if (title && id) title.textContent = tabLabel(id);
}

// 點 tab 展開；再點同一個 tab 收合。加值資料（依賴／母表／週報）首次開 tab 才載入。
function openTab(id) {
  if (state.activeTab === id) { state.activeTab = null; setActiveTab(null); pushURL(); return; }
  state.activeTab = id;
  setActiveTab(id);
  pushURL();
  if (!extrasLoaded) { extrasLoaded = true; loadExtras(); }
}

/* ---- 即時更新：SSE 接線（F1）----
   後端 GET /api/events（事件合約見父 REQ）逐筆推 history 變動；這裡只做「收到事件 →
   重抓那一個節點 → 就地更新 state 與 DOM」，不重抓整棵樹、不整頁重載。 */
var liveState = {
  es: null,
  lastId: 0,       // 已處理的最大事件 id（去重；history id 單調遞增）
  pending: {},     // node_id -> {timer, event}：300ms 內的合併
  downSince: 0,    // 斷線起始時間（ms）；>30s 仍沒恢復就整份重載
  ready: false,    // 初次載入是否完成（未完成前收到的事件先進 buffer，避免漏事件）
  buffer: []       // 載入期間暫存的事件（P3；載入完依序套用）
};

// nodeInScope：節點是否落在「目前檢視的專案」範圍（未指定專案＝全部，一律算在範圍內）。
// 全域 SSE 會收到所有專案的事件；落在範圍外的只更新 state.tree／即時動態，不動目前畫面，
// 這樣開在 A 專案時 B 專案的變動也會廣播到 dashboard，但不會擾動你正在看的 A。
function nodeInScope(nodeID) {
  return !state.filterProject || projectOf(nodeID) === state.filterProject;
}

// findTreeNode：在 state.tree 中找節點，回 {node, parent, index}（parent 為 null＝根層）。
function findTreeNode(id, list, parent) {
  list = list || state.tree || [];
  for (var i = 0; i < list.length; i++) {
    var n = list[i];
    if (!n) continue;
    if (n.id === id) return { node: n, parent: parent || null, index: i };
    var kids = n.children || [];
    if (kids.length) {
      var r = findTreeNode(id, kids, n);
      if (r) return r;
    }
  }
  return null;
}

// setLiveStatus：連線狀態小燈（on＝綠：連線中；off＝灰：重連中）。
function setLiveStatus(on) {
  var node = document.getElementById("live-status");
  if (!node) return;
  node.className = "live-status " + (on ? "on" : "off");
}

// connectEvents：建立 EventSource（全域訂閱，只建一次就不再重建）。
// 2026-09-27 改：不再帶 ?project= —— 後端 fanout 的 projectMatches("")＝全部，所以跨專案
// 事件也收得到（開在 A 專案時 B 專案的變動同樣會廣播進來）。切換專案不再拆線重建，避免
// 重連空窗漏事件；收到的事件一律套進 state.tree（保持全樹新鮮），只有落在目前專案範圍者才重繪畫面。
function connectEvents() {
  if (liveState.es) return;
  var es;
  try { es = new EventSource("/api/events"); }
  catch (e) { setLiveStatus(false); return; }
  liveState.es = es;
  es.addEventListener("open", function () { setLiveStatus(true); liveState.downSince = 0; });
  es.addEventListener("error", function () {
    setLiveStatus(false);
    if (!liveState.downSince) liveState.downSince = Date.now();
    // EventSource 會自動重連；若持續 30 秒仍連不上（可能漏事件）→ 整份重載一次。
    if (Date.now() - liveState.downSince > 30000) { liveState.downSince = Date.now(); resyncAll(); }
  });
  es.addEventListener("node", onNodeEvent);
  es.addEventListener("reset", function () {
    // 載入沒還沒就緒 → 跟一般事件一起暫存，載入完再處理（P3）。
    if (!liveState.ready) { liveState.buffer.push({ action: "reset" }); return; }
    resyncAll();
  });
}

// onNodeEvent：SSE 進入點——先解析；初次載入沒還沒就緒就先暫存（P3，避免漏事件）。
function onNodeEvent(e) {
  var ev;
  try { ev = JSON.parse(e.data); } catch (err) { return; }
  if (!ev || typeof ev !== "object") return;
  if (!liveState.ready) { liveState.buffer.push(ev); return; }
  dispatchLiveEvent(ev);
}

// dispatchLiveEvent (not dispatchEvent: a top-level function of that name would shadow window.dispatchEvent)：套用單一事件（去重 ＋ 判定表見 ISSUE-LIVE-F1）；載入後的緩衝事件重播也走這裡。
// 未知 action 只 debug，不報錯。
function dispatchLiveEvent(ev) {
  var id = (typeof ev.id === "number") ? ev.id : 0;
  if (id && id <= liveState.lastId) return; // 去重：同 id 不處理兩次
  if (id) liveState.lastId = id;
  switch (ev.action) {
    case "reset":
      resyncAll();
      return;
    case "delete":
      addFeed(ev);
      applyDelete(ev);
      return;
    case "comment": case "link": case "unlink": case "hook": case "unhook":
      // 這些不動列表；hook／unhook 不列動態；其餘列動態＋只有剛好在看這個
      // 節點的詳情時才重抓。
      if (ev.action !== "hook" && ev.action !== "unhook") addFeed(ev);
      if (state.selected && state.selected === ev.node_id) loadDetail(state.selected);
      return;
    case "create": case "update": case "transition": case "verify": case "assign":
      addFeed(ev);
      scheduleNodeRefresh(ev);
      return;
    default:
      console.debug("pb live：未知 action，忽略", ev.action, ev);
  }
}

// liveReady：初次載入完成後才開始套用即時事件；載入期間暫存的事件依序重播（P3）。
// 重播的事件都是「重抓節點」且幂等，即使已經反映在剛載入的資料裡，重複套用也無害。
function liveReady() {
  liveState.ready = true;
  var buf = liveState.buffer;
  liveState.buffer = [];
  for (var i = 0; i < buf.length; i++) dispatchLiveEvent(buf[i]);
}

// scheduleNodeRefresh：同一 node 300ms 內的連續事件合併成一次重抓（debounce）。
function scheduleNodeRefresh(ev) {
  var id = ev.node_id;
  if (!id) return;
  var p = liveState.pending[id];
  if (p) { clearTimeout(p.timer); p.event = ev; }
  else { p = liveState.pending[id] = { timer: 0, event: ev }; }
  p.timer = setTimeout(function () {
    delete liveState.pending[id];
    refreshNode(p.event);
  }, 300);
}

// refreshNode：重抓單一節點（沿用既有 /api/node/{id}）→ 就地更新 state.tree；create 時插到父底下。
function refreshNode(ev) {
  var id = ev.node_id;
  getJSON("/api/node/" + encodePath(id)).then(function (node) {
    // 全樹都套用（連別專案的節點也寫回 state.tree），切到那個專案時就馬上是最新的。
    applyNode(node, ev);
    // 只有落在目前專案範圍的事件才重繪畫面／閃爍；範圍外的變動只反映在 state.tree 與即時動態。
    if (!nodeInScope(id)) return;
    renderStats();
    renderTypeStats();
    renderTreePreserveScroll();
    if (state.selected === id) loadDetail(id); // 正在看的詳情也要即時更新
    flashChange(ev); // F2：變動格強閃、父層鏈淡閃（分頁在背景時不播）
  }).catch(function () { /* 節點可能剛被刪；交給 delete 事件處理 */ });
}

// applyNode：把重抓到的節點寫回 state.tree——就地更新純量欄位，保留既有子樹
// （單節點 API 的子節點只有 id/type/status，不足以重建子樹，故不覆蓋 children）。
function applyNode(node, ev) {
  var loc = findTreeNode(node.id);
  if (loc) {
    var n = loc.node;
    n.type = node.type; n.title = node.title; n.status = node.status;
    n.owner = node.owner; n.priority = node.priority;
    return;
  }
  if (ev && ev.parent_id) {
    var p = findTreeNode(ev.parent_id);
    if (p) {
      if (!p.node.children) p.node.children = [];
      p.node.children.push({
        id: node.id, type: node.type, title: node.title,
        status: node.status, owner: node.owner, priority: node.priority, children: []
      });
    }
  }
}

// applyDelete：刪除事件（CTO 2026-09-25 定案）——node_id＝還存在的祖先、from＝被刪節點 id。
// 移除 id=from 的那一列；若正在看它，改選回父層或清空詳情。
function applyDelete(ev) {
  var victim = ev.from;
  if (!victim) return;
  var loc = findTreeNode(victim);
  if (loc) {
    if (loc.parent) loc.parent.children.splice(loc.index, 1);
    else state.tree.splice(loc.index, 1);
  }
  if (state.selected === victim) {
    if (ev.node_id && findTreeNode(ev.node_id)) {
      selectNode(ev.node_id);
    } else {
      state.selected = null;
      var host = document.getElementById("detail");
      host.textContent = "";
      host.appendChild(el("div", "empty", "從左側選一張單"));
    }
  }
  // 範圍外的刪除只從 state.tree 移除，不重繪目前畫面（保持全樹新鮮、不擾動你正在看的專案）。
  if (!nodeInScope(ev.node_id || victim)) return;
  renderStats();
  renderTypeStats();
  renderTreePreserveScroll();
  flashChange(ev); // F2：刪除 ⇒ 閃的是父層（ev.node_id）
}

// renderTreePreserveScroll：重繪樹但保留捲動位置（即時更新不該把使用者的捲軸彈回頂端）。
function renderTreePreserveScroll() {
  var host = document.getElementById("tree");
  var top = host ? host.scrollTop : 0;
  renderTree();
  if (host) host.scrollTop = top;
}

// resyncAll：reset／長時間斷線 → 整份重載（樹＋專案加值資料）。比 reloadProject() 多補
// 重抓一次 /api/tree：reloadProject 不含樹，漏事件時只重抓加值資料會殘留舊樹。
function resyncAll() {
  return getJSON("/api/tree").then(function (tree) {
    state.tree = tree || [];
    renderFilters();
  }).catch(function () { /* 失敗保留舊樹 */ }).then(function () {
    return reloadProject();
  });
}

/* ---- 即時動態列表＋變動閃爍（F2）---- */

// ACTOR_NAMES：actor 代號 → 中文顯示名（名冊；不在表內就顯示原代號，不猜）。
var ACTOR_NAMES = {
  xiaoxia: "小蝦", kaimake: "開碼客", kaimadi: "開碼弟",
  yilong: "一龍", claude: "克勞德", copilot: "副官狗", human: "學長", unassigned: "未指派"
};
function actorName(a) { return (a && ACTOR_NAMES[a]) || a || "—"; }

// nodeShortID：單號短名＝id 最後一段（沒有斜線就原樣）。
function nodeShortID(id) {
  var s = String(id || "");
  var i = s.lastIndexOf("/");
  return i < 0 ? s : s.slice(i + 1);
}

// actionText：動作白話對照表（集中一處；未知 action 顯示原字）。
function actionText(ev) {
  switch (ev.action) {
    case "create": return "新增了 " + (ev.node_type || "節點");
    case "transition": return "轉成 " + (ev.to || "");
    case "verify": return "驗收通過";
    case "assign": return "指派給 " + actorName(ev.to);
    case "comment": return "新增留言";
    case "link": return "掛了連結";
    case "unlink": return "移除連結";
    case "delete": return "刪除了";
    case "update":
      if (ev.field === "owner") return "指派給 " + actorName(ev.to);
      if (ev.field === "title") return "改了標題";
      if (ev.field === "body") return "改了內容";
      if (ev.field === "priority") return "改了優先度";
      if (ev.field === "tags") return "改了標籤";
      return "更新 " + (ev.field || "");
    default: return ev.action || "事件";
  }
}

var FEED_KEY = "pb-feed-collapsed";
var FEED_MAX = 50;
var feedState = { collapsed: false, unread: 0 };

// feedInit：還原收合狀態（localStorage，try/catch）＋綁收合／展開鈕＋空狀態。
function feedInit() {
  try { feedState.collapsed = localStorage.getItem(FEED_KEY) === "1"; } catch (e) { feedState.collapsed = false; }
  var list = document.getElementById("feed-list");
  if (list && !list.children.length) list.appendChild(el("li", "feed-empty", "尚無動態"));
  var toggle = document.getElementById("feed-toggle");
  if (toggle) toggle.addEventListener("click", function () { feedSetCollapsed(true); });
  var bubble = document.getElementById("feed-bubble");
  if (bubble) bubble.addEventListener("click", function () { feedSetCollapsed(false); });
  feedSetCollapsed(feedState.collapsed);
}

// feedSetCollapsed：收合＝整卡藏起、改顯示右下小圓鈕；展開時未讀清零。
function feedSetCollapsed(collapsed) {
  feedState.collapsed = collapsed;
  try { localStorage.setItem(FEED_KEY, collapsed ? "1" : "0"); } catch (e) { /* 私密瀏覽忽略 */ }
  var card = document.getElementById("feed");
  var bubble = document.getElementById("feed-bubble");
  if (card) card.hidden = collapsed;
  if (bubble) bubble.hidden = !collapsed;
  if (!collapsed) { feedState.unread = 0; feedUpdateBadges(); }
}

// feedUpdateBadges：未讀數顯示在小圓鈕＋分頁標題（回到前景／展開時清零）。
function feedUpdateBadges() {
  var bubble = document.getElementById("feed-bubble");
  if (bubble) bubble.textContent = feedState.unread > 99 ? "99+" : String(feedState.unread);
  document.title = feedState.unread ? "(" + feedState.unread + ") ProjectBoard" : "ProjectBoard";
}

// addFeed：把一筆事件推上動態列表（最新在上、最多 FEED_MAX 筆），點擊跳到該節點。
// 分頁在背景或列表收合時累積未讀；前景且展開不算未讀。
function addFeed(ev) {
  var list = document.getElementById("feed-list");
  if (!list) return;
  var placeholder = list.querySelector(".feed-empty");
  if (placeholder) list.removeChild(placeholder);
  var jumpID = ev.node_id;
  var li = el("li", "feed-item");
  li.setAttribute("data-node-id", jumpID || "");
  // 跨專案事件（不在目前檢視專案）加標記：顯示來源專案，跟目前專案的動態區隔開。
  if (!nodeInScope(jumpID)) {
    li.className += " foreign";
    li.appendChild(el("span", "proj", projectOf(jumpID)));
  }
  li.appendChild(el("span", "ts", fmtTime(ev.ts)));
  li.appendChild(el("span", "who", actorName(ev.actor)));
  li.appendChild(el("span", "nid", nodeShortID(ev.action === "delete" ? (ev.from || jumpID) : jumpID)));
  li.appendChild(el("span", "act", actionText(ev)));
  li.addEventListener("click", function () {
    if (!jumpID) return;
    var proj = projectOf(jumpID);
    // 跨專案動態：先切到該專案再選節點，否則樹被篩掉會看不到它。
    if (proj && state.filterProject && proj !== state.filterProject) {
      state.filterProject = proj;
      var fp = document.getElementById("f-project");
      if (fp) fp.value = proj;
      resyncAll().then(function () { selectNode(jumpID); });
      return;
    }
    if (findTreeNode(jumpID)) selectNode(jumpID);
  });
  list.insertBefore(li, list.firstChild);
  while (list.children.length > FEED_MAX) list.removeChild(list.lastChild);
  if (document.hidden || feedState.collapsed) feedState.unread++;
  feedUpdateBadges();
}

var reduceMotion = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };

// rowForNode：找到樹上該節點的列（用 data-node-id 線性比對，避免 id 內的 / . 需轉義）。
function rowForNode(id) {
  if (!id) return null;
  var host = document.getElementById("tree");
  if (!host) return null;
  var rows = host.querySelectorAll("[data-node-id]");
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].getAttribute("data-node-id") === id) return rows[i];
  }
  return null;
}

// flashElement：加 class 播動畫；短時間內同格又變動 → 先移除 class、強制 reflow 再加回，重新開始不疊加。
// reduced-motion：不動畫，改成 2 秒靜態外框提示（用固定時長移除 class）。
function flashElement(elm, strong) {
  if (!elm) return;
  var cls = strong ? "pb-flash" : "pb-flash-parent";
  elm.classList.remove(cls);
  void elm.offsetWidth; // 強制 reflow，讓同一格能重新觸發動畫
  elm.classList.add(cls);
  var dur = reduceMotion.matches ? 2000 : 1200;
  if (elm._pbFlashTimer) clearTimeout(elm._pbFlashTimer);
  elm._pbFlashTimer = setTimeout(function () { elm.classList.remove(cls); }, dur);
}

// flashChange：變動格強閃；父層鏈（事件的 ancestors）同色低透明度、由近到遠每 80ms 像漣漪往上。
// 分頁在背景時不播動畫（只累積動態列表）。
function flashChange(ev) {
  if (document.hidden) return;
  flashElement(rowForNode(ev.node_id), true);
  var anc = ev.ancestors || [];
  for (var i = anc.length - 1, k = 1; i >= 0; i--, k++) {
    (function (id, delay) {
      setTimeout(function () { flashElement(rowForNode(id), false); }, delay);
    })(anc[i], 80 * k);
  }
}

// 分頁回到前景「且」面板已展開 → 未讀清零（標題還原、小圓鈕歸零）；
// 面板仍收合時不清零，跟 addFeed 的累加條件（背景或收合）對稱。
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && !feedState.collapsed) { feedState.unread = 0; feedUpdateBadges(); }
});

/* ---- 啟動 ---- */
// restoreLastPathIfRoot：進根網址`/`(沒帶專案/節點/查詢字串)時，若上次離開有記住畫面
// (LAST_VIEW_KEY)，直接把網址列換成上次那個路徑，讓後面的 readURL() 照著解回去——
// 不用每次重開都固定跳回第一個專案。深連結/帶查詢字串的網址一律照原樣，不動。
function restoreLastPathIfRoot() {
  if (location.pathname !== "/" || location.search) return;
  var last;
  try { last = localStorage.getItem(LAST_VIEW_KEY); } catch (e) { return; }
  if (!last || last === "/" || last === location.pathname + location.search) return;
  try { history.replaceState(null, "", last); } catch (e) { /* file:// 等環境忽略 */ }
}

function loadAll() {
  restoreLastPathIfRoot();
  readURL(); // 先解析網址（deep-link）：/、/專案、/專案/…/節點?tab=&status=
  // P3：先連上即時通道（拿 URL 解析出的專案）再載資料；載入期間收到的事件先進 buffer，
  // 載完由 liveReady() 依序重播，避免「載入完成」與「SSE 連上」之間的變動被漏掉。
  connectEvents();
  // meta（type/owner 清單唯一來源）是加值資訊：失敗退回空清單，不拖垮整頁（fail-soft）。
  var metaReady = getJSON("/api/meta")
    .then(function (m) { state.meta = m || FALLBACK_META; })
    .catch(function () { state.meta = FALLBACK_META; });
  // tree 先來（決定預設專案）；stats 跟著目前專案抓。失敗就是整頁載入失敗。
  return Promise.all([metaReady, getJSON("/api/tree")])
    .then(function (r) {
      var tree = r[1];
      state.tree = tree || [];
      // 網址是根 `/`（未指定）→ 預設第一個專案並寫回網址；`/all` 則維持全部。
      var atRoot = location.pathname === "/" || location.pathname === "";
      if (atRoot && !state.filterProject && state.tree.length) {
        state.filterProject = state.tree[0].id;
        state.selected = state.filterProject;
        state.expanded[state.filterProject] = true;
        pushURL(true);
      }
      return getJSON("/api/stats" + projectQuery());
    })
    .then(function (stats) {
      state.stats = stats || {};
      renderStats();
      renderFilters();
      renderTabs();
      renderTree();
      renderTypeStats();
      renderProgress();
      setUpdated();
      restoreView();
      liveReady(); // 初次載入完成 → 開始套用即時事件（並重播載入期間暫存的）
    })
    .catch(function (err) {
      document.getElementById("tree").textContent = "";
      document.getElementById("tree").appendChild(el("div", "error", "載入失敗：" + err.message));
      liveReady(); // 載入失敗也要放行，否則即時事件永遠卡在 buffer
    });
}

// restoreView：依網址（state）還原詳情／面板，過程中不推歷史。
function restoreView() {
  state.suppressPush = true;
  if (state.selected) selectNode(state.selected);
  if (state.activeTab) {
    setActiveTab(state.activeTab);
    if (!extrasLoaded) { extrasLoaded = true; loadExtras(); }
  }
  state.suppressPush = false;
}

// 週報／母表／依賴是加值資訊：任一失敗只讓該區變空，不拖垮整頁（v0.2/v0.3 fail-soft）。
function loadExtras() {
  return Promise.all([loadDeps(), loadChecklist(), loadReport()]);
}

function projectQuery() {
  return state.filterProject ? "?project=" + encodeURIComponent(state.filterProject) : "";
}

// 依賴是加值資訊：失敗只讓依賴列變空，不拖垮整頁（v0.2 fail-soft）。跟目前專案走。
function loadDeps() {
  return getJSON("/api/deps" + projectQuery())
    .then(function (deps) { state.deps = deps || []; })
    .catch(function () { state.deps = []; })
    .then(function () { renderFocus(); });
}

function loadChecklist() {
  return getJSON("/api/checklist" + projectQuery())
    .then(function (rows) { state.checklist = rows || []; })
    .catch(function () { state.checklist = []; })
    .then(function () { renderChecklist(); });
}

function loadReport() {
  return getJSON("/api/report" + projectQuery())
    .then(function (rep) { state.report = rep || null; })
    .catch(function () { state.report = null; })
    .then(function () { renderWeekly(); });
}

// 專案下拉變更：樹在前端過濾；焦點／進度／母表／週報跟著專案重新抓（範圍與 --project 一致）。
function reloadProject() {
  return Promise.all([
    getJSON("/api/stats" + projectQuery())
      .then(function (s) { state.stats = s || {}; })
      .catch(function () { /* 失敗保留舊值 */ }),
    loadDeps(),
    loadChecklist(),
    loadReport()
  ]).then(function () {
    renderStats();
    renderTypeStats();
    renderProgress();
    renderFocus();
  });
}

document.getElementById("refresh").addEventListener("click", function () { location.reload(); });
document.getElementById("f-project").addEventListener("change", function (e) {
  state.filterProject = e.target.value;
  // 切換專案時右側詳情要跟著換成新專案本身的說明，不要留著舊專案內容或空白
  // （2026-09-22 導演要求，跟直連網址預設選定專案是同一件事）。
  if (state.filterProject) {
    state.expanded[state.filterProject] = true;
    selectNode(state.filterProject);
  } else {
    state.selected = null;
    pushURL();
    renderTree();
    var host = document.getElementById("detail");
    host.textContent = "";
    host.appendChild(el("div", "empty", "從左側選一張單"));
  }
  // 切專案：重抓全樹＋加值資料（resyncAll），確保切過去就是最新——
  // 不依賴即時事件已經把每個節點都補到（跨專案事件也在背景更新 state.tree，這裡是最後一道保險）。
  resyncAll().then(function () { renderTree(); });
  connectEvents(); // 全域連線，已是 no-op（只建一次）
});
document.getElementById("f-owner").addEventListener("change", function (e) {
  state.filterOwner = e.target.value;
  renderStats();
  renderTypeStats();
  renderTree();
});

/* 上一頁／下一頁：依網址還原（不推歷史）。 */
window.addEventListener("popstate", function () {
  state.suppressPush = true;
  readURL();
  document.getElementById("detail").textContent = "";
  renderStats();
  renderTypeStats();
  renderTree();
  if (state.selected) selectNode(state.selected);
  setActiveTab(state.activeTab);
  resyncAll().then(function () { renderTree(); });
  connectEvents();
  state.suppressPush = false;
});


/* header 分頁：點 tab 展開該面板（再點收合）。 */
Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (btn) {
  btn.addEventListener("click", function () { openTab(btn.getAttribute("data-tab")); });
});

/* ---- 主題切換（INTERFACE §4）---- */
var THEME_KEY = "pb-theme";
function storedTheme() {
  try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
}
function currentTheme() {
  return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
}
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  var btn = document.getElementById("theme-toggle");
  if (btn) {
    var nextLabel = theme === "dark" ? "切換為亮色模式" : "切換為暗色模式";
    btn.setAttribute("aria-label", nextLabel);
    btn.setAttribute("title", nextLabel);
  }
}
document.getElementById("theme-toggle").addEventListener("click", function () {
  var next = currentTheme() === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* 無法寫入就只在本次生效 */ }
  applyTheme(next);
});
if (window.matchMedia) {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  var onSystemChange = function (e) {
    if (!storedTheme()) applyTheme(e.matches ? "dark" : "light"); // 沒存選擇才跟隨系統
  };
  if (mq.addEventListener) mq.addEventListener("change", onSystemChange);
  else if (mq.addListener) mq.addListener(onSystemChange);
}
applyTheme(currentTheme());
feedInit(); // 即時動態卡片：還原收合狀態並綁事件（F2）

loadAll();
</script>
</body>
</html>
